name: ${NOVABOT_PROJECT_NAME:-novabot}
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment: {POSTGRES_DB: openbot, POSTGRES_USER: openbot, POSTGRES_PASSWORD: "${PG_PASSWORD}"}
    volumes: [pgdata:/var/lib/postgresql/data]
    mem_limit: 320m
    command: ["postgres","-c","shared_buffers=128MB","-c","max_connections=50"]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U openbot -d openbot"], interval: 5s, retries: 10}
    restart: unless-stopped
    networks: [data]
  migrate:
    build:
      context: .
      dockerfile: server/Dockerfile
      args: {TENANT_PACKAGE_DIR: ../examples/novagente}
    image: ${NOVABOT_PROJECT_NAME:-novabot}-server:latest
    command: ["bun","scripts/migrate.ts"]
    environment: {DATABASE_URL: "postgres://openbot:${PG_PASSWORD}@postgres:5432/openbot"}
    depends_on: {postgres: {condition: service_healthy}}
    restart: "no"
    mem_limit: 256m
    networks: [data]
  server:
    image: ${NOVABOT_PROJECT_NAME:-novabot}-server:latest
    env_file: ["${NOVABOT_ENV_FILE:-.env}"]
    environment:
      PORT: "3001"
      SERVER_PORT: "3001"
      NOVABOT_LOCAL_RUNTIME: "true"
      DATABASE_URL: "postgres://openbot:${PG_PASSWORD}@postgres:5432/openbot"
      MANAGED_AGENT_AG_UI_URL: http://agent-bot:4200/ag-ui
      COPILOTKIT_OPENAI_API: chat
      OPENAI_BASE_URL: https://api.deepseek.com
      TENANT_PACKAGE_DIR: ../examples/novagente
      COPILOTKIT_TELEMETRY_DISABLED: "true"
      # Memory per agent: local embeddings (multilingual-e5-small, 384 dims)
      NOVABOT_EMBED_URL: http://embed:4400
      # One computer PER BOT (own container + browser profile + volumes)
      NOVABOT_ISOLATE_EVERY_BOT: "true"
      COMPUTER_SUPERVISOR_URL: http://supervisor:4300
    user: "1001:1001"
    volumes: ["${NOVABOT_DATA_DIR:-./.openbot}:/openbot"]
    ports: ["127.0.0.1:${NOVABOT_HOST_PORT:-13010}:3001"]
    depends_on: {migrate: {condition: service_completed_successfully}}
    restart: unless-stopped
    mem_limit: 640m
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"const r = await fetch('http://127.0.0.1:3001/health'); process.exit(r.ok ? 0 : 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [data, default]
  worker:
    image: ${NOVABOT_PROJECT_NAME:-novabot}-server:latest
    command: ["bun","../worker/src/index.ts"]
    environment:
      DATABASE_URL: "postgres://openbot:${PG_PASSWORD}@postgres:5432/openbot"
      SERVER_INTERNAL_URL: http://server:3001
      WORKER_SHARED_SECRET: "${WORKER_SHARED_SECRET}"
    depends_on: {server: {condition: service_started}}
    restart: unless-stopped
    mem_limit: 160m
    networks: [data]
  agent-bot:
    build: {context: ., dockerfile: agent-bot/Dockerfile}
    image: ${NOVABOT_PROJECT_NAME:-novabot}-agent-bot:latest
    environment:
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      OPENAI_BASE_URL: https://api.deepseek.com
      BOT_MODEL: deepseek-flash
      MANAGED_AGENT_TOKEN: "${MANAGED_AGENT_TOKEN}"
    restart: unless-stopped
    mem_limit: 128m
    networks: [default]
  embed:
    build: {context: embed}
    image: ${NOVABOT_PROJECT_NAME:-novabot}-embed:latest
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4400/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks: [data]
  supervisor:
    build: {context: ., dockerfile: supervisor/Dockerfile}
    image: ${NOVABOT_PROJECT_NAME:-novabot}-supervisor:latest
    environment:
      SUPERVISOR_TOKEN: "${SUPERVISOR_TOKEN}"
      COMPUTER_TOKEN: "${COMPUTER_TOKEN}"
      COMPUTER_IMAGE: ${NOVABOT_PROJECT_NAME:-novabot}-agent-computer:latest
      COMPUTER_NETWORK: ${NOVABOT_PROJECT_NAME:-novabot}_default
      COMPUTER_NAMESPACE: ${NOVABOT_PROJECT_NAME:-novabot}
      COMPUTER_MEMORY_BYTES: "671088640"
      NOVABOT_MAX_COMPUTERS: "${NOVABOT_MAX_COMPUTERS:-1}"
      NOVABOT_MIN_AVAILABLE_MB: "${NOVABOT_MIN_AVAILABLE_MB:-3072}"
      NOVABOT_COMPUTER_IDLE_MINUTES: "${NOVABOT_COMPUTER_IDLE_MINUTES:-15}"
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
    restart: unless-stopped
    mem_limit: 96m
    networks: [default]
# Per-deployment memory caps (migrate is one-shot): 1856 MB baseline + up to
# NOVABOT_MAX_COMPUTERS * 640 MB. Defaults to one computer on an unchanged VPS.
networks: {data: {internal: true}, default: {}}
volumes: {pgdata: {}}
