name: NOVAGENTE Conexões MVP QA

on:
  pull_request:
    paths:
      - "server/src/conexoes/**"
      - "server/src/db/schema/novagente-conexoes.ts"
      - "server/drizzle/**"
      - "server/tests/novagente-conexoes.test.ts"
      - "app/src/components/conexoes/**"
      - ".github/workflows/novagente-conexoes.yml"

permissions:
  contents: read

jobs:
  conexoes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: openbot
          POSTGRES_PASSWORD: openbot
          POSTGRES_DB: openbot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openbot -d openbot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - name: Testar isolamento e permissões
        run: bun test server/tests/novagente-conexoes.test.ts
      - name: Migrar PostgreSQL descartável para teste
        env:
          DATABASE_URL: postgres://openbot:openbot@localhost:5432/openbot_test
        run: |
          cd server
          bunx drizzle-kit migrate --config=drizzle.config.ts
      - name: Testar autorização contra PostgreSQL real
        env:
          TEST_DATABASE_URL: postgres://openbot:openbot@localhost:5432/openbot_test
        run: bun test server/tests/novagente-conexoes.integration.test.ts
      - name: Verificar tipos
        run: |
          bun run --cwd server typecheck
          bun run --cwd app typecheck
      - name: Verificar formato dos arquivos do MVP
        run: |
          bunx biome format \
            server/src/conexoes/store.ts \
            server/src/conexoes/routes.ts \
            server/src/db/schema/novagente-conexoes.ts \
            server/tests/novagente-conexoes.test.ts \
            server/tests/novagente-conexoes.integration.test.ts \
            server/src/app.ts \
            server/src/index.ts \
            app/src/components/conexoes/conexoes-panel.tsx
      - name: Verificar snapshot e migração Drizzle sem alterações
        env:
          DATABASE_URL: postgres://openbot:test@localhost:5432/openbot_test
        run: |
          set -euo pipefail
          cd server
          bunx drizzle-kit check --config=drizzle.config.ts
          bunx drizzle-kit generate --config=drizzle.config.ts --name=ci_probe
          if [ -n "$(git status --porcelain drizzle)" ]; then
            echo "::error::Migration drift detected; commit the correct schema snapshot."
            git status --porcelain drizzle
            exit 1
          fi
